# secret-scan — the gitleaks merge gate
#
# Owner: Node 6 (Antigravity). Authored by Node 1 during Phase 0, pulled
# forward from Phase 3 as the compensating control for the gap recorded in
# SECURITY.md §5.1: GitHub's free secret scanning matches provider patterns
# only, so generic secrets would otherwise reach a public repository unseen.
#
# How this file applies MASTER_PLAN.md §7.2:
#   - Least privilege. The token is read-only and the job uses no secrets at
#     all, so a fork pull request gets exactly the same scan as a maintainer.
#   - No third-party action for the scanner. The gitleaks binary comes from its
#     official release and must match the SHA-256 pinned below; a tampered or
#     swapped release fails closed instead of running.
#   - The one action that is used is pinned to a full commit SHA.
#   - Findings are redacted. CI logs on a public repository are public, and an
#     unredacted secret scanner is itself a secret leak.
#   - Fail closed. Before scanning, the gate proves it is not blind: it plants
#     runtime-generated canaries and requires every one to be detected.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Bump these together. Take the checksum from the release's own
      # checksums.txt AND confirm it equals GitHub's asset digest — two
      # independent sources, never one.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Self-test — prove the gate is not blind
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/canaries"
          report="$RUNNER_TEMP/canary-report.json"
          mkdir -p "$dir"

          # Canaries are assembled at runtime, so no secret-shaped string ever
          # exists in git history. The derivation is deterministic, so a failure
          # here is reproducible rather than flaky.
          derive() { printf '%s' "$1" | openssl dgst -sha256 -binary | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32; }
          api_value="$(derive nexusdev-canary-api-v1)"
          url_value="$(derive nexusdev-canary-url-v1)"

          ssh-keygen -q -t ed25519 -N '' -C canary -f "$dir/id_canary"
          printf 'NEXUS_API_TOKEN="%s"\n' "$api_value" > "$dir/api.env"
          printf 'HERMES_ENDPOINT=https://%s:%s@%s\n' nexus "$url_value" hermes.example.invalid > "$dir/endpoint.env"

          # Negative controls: none of these may be flagged as
          # url-embedded-credentials.
          cat > "$dir/benign.txt" <<'EOF'
          HERMES_ENDPOINT=http://localhost:11434
          git@github.com:mntoyg/NexusDev.git
          a URL of the form https://user:pass@host
          postgres://app:${DB_PASSWORD}@db:5432/app
          EOF

          gitleaks dir "$dir" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner --redact --exit-code 0 \
            --report-format json --report-path "$report"
          test -s "$report" || { echo "::error::gitleaks wrote no report"; exit 1; }

          fail=0
          expect() { # <rule-id> <file-suffix>
            if jq -e --arg r "$1" --arg f "$2" \
                 'any(.[]; .RuleID == $r and (.File | endswith($f)))' "$report" >/dev/null; then
              echo "ok: $1 detected in $2"
            else
              echo "::error::gate is blind: $1 was not detected in $2"
              fail=1
            fi
          }
          expect private-key              id_canary
          expect generic-api-key          api.env
          expect url-embedded-credentials endpoint.env

          if jq -e 'any(.[]; .RuleID == "url-embedded-credentials" and (.File | endswith("benign.txt")))' "$report" >/dev/null; then
            echo "::error::url-embedded-credentials fired on a benign control line"
            fail=1
          else
            echo "ok: no false positive on benign controls"
          fi
          exit "$fail"

      - name: Scan full git history
        run: |
          set -euo pipefail
          gitleaks git "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner --redact --verbose --exit-code 1
