# secret-scan — the gitleaks merge gate
#
# Owner: Node 6 (Antigravity). Authored by Node 1 during Phase 0, pulled
# forward from Phase 3 as the compensating control for the gap recorded in
# SECURITY.md §5.1: GitHub's free secret scanning matches provider patterns
# only, so generic secrets would otherwise reach a public repository unseen.
#
# How this file applies MASTER_PLAN.md §7.2:
#   - Least privilege. The token is read-only and the job uses no secrets at
#     all, so a fork pull request gets exactly the same scan as a maintainer.
#   - No third-party action for the scanner. The gitleaks binary comes from its
#     official release and must match the SHA-256 pinned below; a tampered or
#     swapped release fails closed instead of running.
#   - The one action that is used is pinned to a full commit SHA.
#   - Findings are redacted. CI logs on a public repository are public, and an
#     unredacted secret scanner is itself a secret leak.
#   - Fail closed. Before scanning, the gate proves it is not blind: it plants
#     runtime-generated canaries and requires every one to be detected.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Bump these together. Take the checksum from the release's own
      # checksums.txt AND confirm it equals GitHub's asset digest — two
      # independent sources, never one.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: bash scripts/ci/install-gitleaks.sh

      - name: Self-test — prove the gate is not blind
        run: bash scripts/ci/selftest-gitleaks.sh

      - name: Scan full git history
        run: gitleaks git "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --no-banner --redact --verbose --exit-code 1
