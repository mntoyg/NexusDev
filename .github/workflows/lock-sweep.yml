# lock-sweep — remove abandoned task locks (TASK-005)
#
# Owner: Node 6 (Antigravity).
#
# ADR-004 made a git ref the task mutex. A run that is killed rather than merely
# crashing never reaches its release, so the ref survives with nobody holding it.
# `trap release_lock EXIT` covers a crash; only a TTL covers a SIGKILL, and only
# something outside the dead run can act on that TTL. This is that something.
#
# This is the only workflow in the repository that asks for write access, so the
# reasons are spelled out rather than assumed:
#
#   - `contents: write` is required to delete a ref, and is declared on the one
#     job that needs it. Nothing else here gets it.
#   - `persist-credentials` is left at its default of true, unlike
#     secret-scan.yml and validate-context.yml which set it false. The push that
#     deletes the lock has to authenticate. The trade is deliberate: a token is
#     left in the local git config for the life of a job that runs no
#     third-party action and no untrusted input.
#   - The sweeper never breaks a young lock. `task_lock.py break` refuses below
#     the threshold, so a live run cannot be robbed of its claim by this job.
#
# The threshold is four TTLs. MASTER_PLAN.md §3.4 puts the default TTL at 900
# seconds, and breaking early would be worse than letting a ref accumulate for
# another hour.

name: lock-sweep

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      older_than:
        description: "Break locks older than this many seconds"
        required: false
        default: "3600"

permissions:
  contents: read

concurrency:
  group: lock-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sweep abandoned locks
        env:
          OLDER_THAN: ${{ inputs.older_than || '3600' }}
        run: bash scripts/ci/sweep-locks.sh
